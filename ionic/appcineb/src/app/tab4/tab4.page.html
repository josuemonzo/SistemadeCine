<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Reserva de tickets</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    @for(ticket of tickets; track ticket.idTickets){
    <ion-item>
      <ion-label>{{ticket.idTickets}}</ion-label>
      <ion-label>{{ticket.numeroReserva}}</ion-label>
      <ion-label>{{ticket.fechaReserva}}</ion-label>
      <ion-label>{{ticket.fechaCreacion | date}}</ion-label>
    </ion-item>
    }
  </ion-list>
</ion-content>
