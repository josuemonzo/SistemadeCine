<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Anuncios creados
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    @for(anuncio of anuncios; track anuncio.idAnuncio){
    <ion-item>
      <ion-label>{{anuncio.idAnuncio}}</ion-label>
      <ion-label>{{anuncio.descripcion}}</ion-label>
      <ion-label>{{anuncio.fechaPublicaion}}</ion-label>
      <ion-label>{{anuncio.titulo}}</ion-label>
      <ion-label>{{anuncio.tipo}}</ion-label>
      <ion-label>{{anuncio.fechaCreacion | date}}</ion-label>
    </ion-item>
    }

  </ion-list>
</ion-content>
